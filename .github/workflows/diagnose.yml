name: 🔍 Diagnose Bot (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: WIF close/open history today (no restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bybit-memecoin-bot
            echo "=== WIFUSDT lines today (open/close) ==="
            grep "WIFUSDT" logs/manager_$(date +%Y%m%d).log | grep -E "LONG|SHORT|Closed|✅|Opposite" 
            echo "=== Closed/PnL lines today (any symbol) ==="
            grep -E "Closed \||PnL:" logs/manager_$(date +%Y%m%d).log | grep -v "waiting\|PnL:\+0.0000" | tail -40
            echo "=== record_trade / tracker errors ==="
            grep -iE "tracker|record_trade" logs/manager_$(date +%Y%m%d).log | tail -20
            echo "=== Any exceptions today ==="
            grep -iE "error|exception|traceback" logs/manager_$(date +%Y%m%d).log | tail -30
            echo "=== trades.json mtime ==="
            stat -c '%y %n' logs/trades.json
            echo "=== DONE ==="
