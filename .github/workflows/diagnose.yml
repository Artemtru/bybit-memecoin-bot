name: 🔍 Diagnose Bot (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check restart count and circuit breaker activity (no restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bybit-memecoin-bot
            echo "=== How many times manager started today (restart count) ==="
            grep -c "MANAGER v3" logs/manager_$(date +%Y%m%d).log 2>/dev/null
            echo "=== Timestamps of each manager start today ==="
            grep "MANAGER v3" logs/manager_$(date +%Y%m%d).log 2>/dev/null
            echo "=== Full .env (no secrets) ==="
            grep -vE "KEY|SECRET|TOKEN" .env
            echo "=== Scanner filters ==="
            grep -E "MEME_KEYWORDS|min_volume|max_change|MAX_CHANGE" scanner.py | head -20
            echo "=== ADX / volume confirmation present in manager.py? ==="
            grep -niE "adx|volume_ok|vol_ok" manager.py
            echo "=== journalctl restart events today ==="
            journalctl -u memecoin-bot --since today --no-pager | grep -iE "Scheduled restart|Started memecoin|Main process exited" | tail -40
            echo "=== DONE ==="
