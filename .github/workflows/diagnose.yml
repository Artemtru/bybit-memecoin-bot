name: 🔍 Diagnose Bot (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Full status + today's activity (no restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bybit-memecoin-bot
            echo "=== systemctl status (no restart) ==="
            systemctl status memecoin-bot --no-pager -l | head -10
            echo "=== Restarts/uptime ==="
            systemctl show memecoin-bot -p MainPID,ActiveState,SubState,NRestarts,ActiveEnterTimestamp
            echo "=== status.json ==="
            cat logs/status.json 2>/dev/null
            echo ""
            echo "=== trades.json full ==="
            cat logs/trades.json 2>/dev/null
            echo ""
            echo "=== Today's manager log (all signal/trade lines) ==="
            TODAY=$(date +%Y%m%d)
            grep -E "Сигнал|Signal|Opening|Открыт|ОТКРЫТ|TP|SL|close_position|Closing|Закрыт" logs/manager_${TODAY}.log 2>/dev/null | tail -60 || echo "NO MATCHES OR NO LOG FOR TODAY"
            echo "=== Today's log line count ==="
            wc -l logs/manager_${TODAY}.log 2>/dev/null || echo "NO LOG FILE FOR TODAY"
            echo "=== Last 50 lines of today's log (raw) ==="
            tail -50 logs/manager_${TODAY}.log 2>/dev/null
            echo "=== Key .env params ==="
            grep -E "^(MAX_BOTS|QTY_USDT|HERMES_ENABLED|SCAN_INTERVAL_MIN|RSI_BUY|RSI_SELL|LEVERAGE|DAILY_LOSS_LIMIT|MAX_CHANGE_PCT|BB_PERIOD|BB_STD)=" .env
            echo "=== DONE ==="
