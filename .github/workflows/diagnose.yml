name: 🔍 Diagnose Bot (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Get crash traceback (no restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bybit-memecoin-bot
            echo "=== Last 150 lines of service-error.log (the crash) ==="
            tail -150 logs/service-error.log 2>/dev/null || echo "NO ERROR LOG"
            echo "=== Current git commit on VPS ==="
            git log --oneline -3
            echo "=== git status ==="
            git status
            echo "=== DONE ==="
