name: Fix Bot Environment

on:
  workflow_dispatch:  # ручной запуск

jobs:
  update-env:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔧 Update .env and restart bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bybit-memecoin-bot
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Текущие параметры в .env:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            grep -E "^(QTY_USDT|RSI_BUY|RSI_SELL|ATR_TP_MULT|ATR_SL_MULT|LEVERAGE)=" .env || echo "(параметры не найдены)"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Обновление параметров..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Создаём temporary файл с обновлениями
            cp .env .env.backup
            
            # Удаляем старые значения этих параметров
            sed -i '/^QTY_USDT=/d' .env
            sed -i '/^RSI_BUY=/d' .env
            sed -i '/^RSI_SELL=/d' .env
            sed -i '/^ATR_TP_MULT=/d' .env
            sed -i '/^ATR_SL_MULT=/d' .env
            sed -i '/^LEVERAGE=/d' .env
            
            # Добавляем новые значения
            cat >> .env << 'ENVEOF'
            
            # ═══════════════════════════════════════════════════════════
            # Агрессивная стратегия (обновлено GitHub Actions 2026-09-08)
            # ═══════════════════════════════════════════════════════════
            LEVERAGE=2
            QTY_USDT=50
            RSI_BUY=40
            RSI_SELL=60
            ATR_TP_MULT=2.5
            ATR_SL_MULT=1.2
            ENVEOF
            
            echo "✅ .env обновлён (backup: .env.backup)"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Новые параметры:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            grep -E "^(QTY_USDT|RSI_BUY|RSI_SELL|ATR_TP_MULT|ATR_SL_MULT|LEVERAGE)=" .env
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Перезапуск ботов..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sudo systemctl restart memecoin-bot telegram-bot
            
            echo "⏳ Ожидание 5 секунд..."
            sleep 5
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Статус сервисов:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sudo systemctl status memecoin-bot --no-pager -l | head -15
            echo ""
            sudo systemctl status telegram-bot --no-pager -l | head -15
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Последние строки лога:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            tail -20 logs/manager_$(date +%Y%m%d).log || echo "Лог-файл не найден"
            
            echo ""
            echo "✅ Готово! Проверьте бота командой /top в Telegram через минуту."
